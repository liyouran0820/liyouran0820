name: Update profile metrics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/profile-metrics.yml'
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify data handling
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Generate profile dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_metrics.py
      - name: Commit refreshed dashboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/dashboard
          if ! git diff --cached --quiet; then
            git commit -m '更新主页公开统计'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
